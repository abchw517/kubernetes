apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration

# =========================================================
# Kubelet Resource Governance Baseline
# Kubernetes >= v1.34
# =========================================================


# =========================================================
# 01. Cluster / Basic
# =========================================================

# Kubernetes 集群 DNS 域。
clusterDomain: cluster.local

# Kubernetes DNS Service ClusterIP。
#
# 注意：
# 必须按照实际集群 CoreDNS / kube-dns Service IP 修改。
clusterDNS:
  - 10.96.0.10


# =========================================================
# 02. API Server Client
# =========================================================

# kubelet 与 apiserver 通信的平均 QPS。
# Kubernetes v1.34 默认值：50。
kubeAPIQPS: 50

# kubelet 与 apiserver 通信允许的瞬时 Burst。
# Kubernetes v1.34 默认值：100。
kubeAPIBurst: 100


# =========================================================
# 03. Image Pull
# =========================================================

# false：
# 允许多个镜像并行拉取。
#
# 对现代 containerd / CRI-O 节点通常更适合批量发布场景。
serializeImagePulls: false

# 可选：
# 如果希望进一步限制并发镜像拉取数，可以设置：
#
# maxParallelImagePulls: 5
#
# 注意：
# serializeImagePulls=true 时不能同时配置该参数。


# =========================================================
# 04. CPU Manager
# =========================================================

# 普通业务节点使用 none。
#
# GPU / NUMA / DPDK / NFV / 低延迟节点应该单独配置 static。
cpuManagerPolicy: none


# =========================================================
# 05. Pod Density
# =========================================================

# Kubernetes 默认值：110。
#
# 当前企业基线设置 143。
#
# 是否适合使用 143，应同时结合：
#   CPU / Memory
#   CNI IP Pool
#   conntrack
#   PID
#   inode
#   containerd
#   kubelet
#   日志量
#   网络连接数
# 评估。
maxPods: 143

# 每个 Pod 最大 PID 数。
#
# Kubernetes 默认：
# -1，即不限制。
#
# 设置 16384 可以降低 fork bomb / 进程泄漏影响整个 Node 的风险。
podPidsLimit: 16384


# =========================================================
# 06. Container Log Rotation
# =========================================================

# Kubernetes 默认值：10Mi。
#
# 当前生产基线放宽至 50Mi，
# 减少日志量较大应用频繁轮转。
containerLogMaxSize: 50Mi

# Kubernetes 默认值：5。
containerLogMaxFiles: 5


# =========================================================
# 07. Image Garbage Collection
# =========================================================

# Kubernetes v1.34 默认值：2m。
#
# 设置为 5m：
# 避免滚动升级 / 回滚场景中镜像刚刚 unused 就被回收。
imageMinimumGCAge: 5m

# Kubernetes 默认：
#
# High = 85
# Low  = 80
#
# 通用生产基线建议：
#
# 80% 开始 Image GC
# 70% 停止 Image GC
#
# 给 imagefs 保留更多安全空间，同时避免 50/40 过度频繁 GC。
imageGCHighThresholdPercent: 80
imageGCLowThresholdPercent: 70


# =========================================================
# 08. Eviction Default Merge
# =========================================================

# 非常重要。
#
# 如果自定义 evictionHard / evictionSoft 等参数，
# 未显式配置的默认 signal 是否继续继承 Kubernetes 默认值。
#
# true：
# 保留未覆盖的默认值。
#
# 建议生产环境显式开启。
mergeDefaultEvictionSettings: true


# =========================================================
# 09. Soft Eviction
# =========================================================

# Soft Eviction 负责提前进入保护区。
#
# 注意：
# Soft Eviction 并不是简单的“报警机制”，
# Grace Period 到期后 kubelet 会执行真正 Pod Eviction。

evictionSoft:

  # NodeFS 可用空间低于 15%。
  nodefs.available: "15%"

  # ImageFS 可用空间低于 20%。
  imagefs.available: "20%"

  # NodeFS inode 剩余低于 10%。
  nodefs.inodesFree: "10%"


# =========================================================
# 10. Soft Eviction Grace Period
# =========================================================

evictionSoftGracePeriod:

  nodefs.available: "2m"

  imagefs.available: "2m"

  nodefs.inodesFree: "2m"


# =========================================================
# 11. Hard Eviction
# =========================================================

evictionHard:

  # NodeFS 最后安全线。
  nodefs.available: "10%"

  # ImageFS 最后安全线。
  imagefs.available: "15%"

  # inode 最后安全线。
  nodefs.inodesFree: "5%"

  # 节点可用内存低于 1Gi 时执行 Hard Eviction。
  #
  # 注意：
  # 1Gi 并不一定适用于所有机器。
  #
  # 例如：
  #
  # 8Gi Node
  # 1Gi = 12.5%
  #
  # 256Gi Node
  # 1Gi = 0.4%
  #
  # 大内存节点应该重新评估。
  memory.available: "1Gi"


# =========================================================
# 12. Eviction Minimum Reclaim
# =========================================================

# 防止：
#
# Pressure
#    ↓
# reclaim 很少
#    ↓
# Pressure
#
# 形成反复抖动。

evictionMinimumReclaim:

  # NodeFS 至少额外回收 500Mi。
  nodefs.available: "500Mi"

  # ImageFS 至少额外回收 2Gi。
  imagefs.available: "2Gi"

  # Memory 可根据节点规格选择是否配置。
  #
  # 通用模板暂不强制配置。
  #
  # memory.available: "256Mi"


# =========================================================
# 13. Eviction Stability
# =========================================================

# Kubernetes v1.34 默认值：5m。
#
# 不建议使用 30s 作为通用生产基线。
#
# 它控制 Node Pressure condition
# 从 Pressure 恢复到 Normal 前需要保持稳定多久。
evictionPressureTransitionPeriod: 5m

# 仅影响 Soft Eviction。
#
# 实际 grace：
#
# min(
#   evictionMaxPodGracePeriod,
#   Pod terminationGracePeriodSeconds
# )
#
# 60 秒适合作为一般业务基线。
evictionMaxPodGracePeriod: 60


# =========================================================
# 14. Node Resource Reservation
# =========================================================

# 注意：
#
# Reservation 不是简单告诉 Scheduler：
#
# "系统需要这些资源"
#
# 它最终参与 Node Allocatable 计算。
#
# 大致关系：
#
# Capacity
#   -
# systemReserved
#   -
# kubeReserved
#   -
# eviction reservation
#   =
# Node Allocatable


# =========================================================
# 15. systemReserved
# =========================================================

# Kubernetes v1.34 通用配置中，
# 建议仅使用明确支持的 cpu / memory。
#
# 不将 pid 放在这里。
systemReserved:

  # 100m 适合小型基础配置，
  # 但高密度节点建议根据系统服务实际监控调整。
  cpu: "100m"

  memory: "1Gi"


# =========================================================
# 16. kubeReserved
# =========================================================

# kubelet / container runtime /
# Kubernetes Node Component 资源预留。
kubeReserved:

  cpu: "100m"

  memory: "1Gi"


# =========================================================
# 17. Node Allocatable Enforcement
# =========================================================

# 通用节点建议先只强制 Pods 使用 Allocatable。
#
# 如果需要进一步严格限制：
#
# system-reserved
# kube-reserved
#
# 就必须同时正确规划：
#
# systemReservedCgroup
# kubeReservedCgroup
#
# 不应该直接打开。
enforceNodeAllocatable:
  - pods


# =========================================================
# 18. cgroup
# =========================================================

# Kubernetes v1.34 + systemd + containerd
# 通用推荐 systemd cgroup driver。
cgroupDriver: systemd

# Kubernetes QoS cgroup。
cgroupsPerQOS: true


# =========================================================
# 19. Kubelet Security Baseline
# =========================================================

# 禁止 kubelet 10255 只读匿名端口。
readOnlyPort: 0

authentication:

  anonymous:
    enabled: false

  webhook:
    enabled: true

authorization:
  mode: Webhook
