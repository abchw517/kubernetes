# pod-start-time-check v2.2.0
# Production RBAC baseline: read-only and intentionally minimal.
# Required permissions:
#   - core/pods: list
#   - apps/replicasets: list
#
# v2.2.0 Strict RBAC preflight also rejects obvious over-privileged identities
# such as wildcard */*, secrets:get, pods:delete, deployments:patch and
# clusterrolebindings:create.
apiVersion: v1
kind: Namespace
metadata:
  name: pod-start-time-check-system
  labels:
    app.kubernetes.io/name: pod-start-time-check
    app.kubernetes.io/part-of: kubernetes-ops-tools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-start-time-check
  namespace: pod-start-time-check-system
  labels:
    app.kubernetes.io/name: pod-start-time-check
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-start-time-check
  labels:
    app.kubernetes.io/name: pod-start-time-check
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-start-time-check
  labels:
    app.kubernetes.io/name: pod-start-time-check
subjects:
  - kind: ServiceAccount
    name: pod-start-time-check
    namespace: pod-start-time-check-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-start-time-check
